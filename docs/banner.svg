<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">RecallRoom</title>
  <desc id="d">RecallRoom logo next to a chat room where a drug recall is opened, matched against store stock, approved by the QA Head and closed.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .m { opacity: 0; animation: 10s ease-out infinite; }
    .m1 { animation-name: m1; } .m2 { animation-name: m2; } .m3 { animation-name: m3; } .m4 { animation-name: m4; }
    .typing circle { animation: blink 1.2s ease-in-out infinite; }
    .typing circle:nth-child(2) { animation-delay: .2s; } .typing circle:nth-child(3) { animation-delay: .4s; }
    @keyframes ring { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes m1 { 0%, 4% { opacity: 0; transform: translateY(8px); } 9%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes m2 { 0%, 22% { opacity: 0; transform: translateY(8px); } 27%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes m3 { 0%, 42% { opacity: 0; transform: translateY(8px); } 47%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes m4 { 0%, 62% { opacity: 0; transform: translateY(8px); } 67%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ring, .typing circle { animation: none; } .m { animation: none; opacity: 1; } }
  </style>

  <rect x="1" y="1" width="1198" height="298" rx="20" fill="#F6F3EC" stroke="#DAD3C4" stroke-width="2"/>

  <!-- Logo: a chat bubble holding a capsule, with a recall alert dot -->
  <g transform="translate(64 96)">
    <rect width="88" height="88" rx="20" fill="#14161A"/>
    <path d="M22 26 h44 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-26 l-12 10 v-10 h-6 a8 8 0 0 1 -8 -8 v-22 a8 8 0 0 1 8 -8 z" fill="#FFFFFF"/>
    <g transform="rotate(-30 44 45)">
      <rect x="28" y="39" width="32" height="13" rx="6.5" fill="#D7263D"/>
      <rect x="44" y="39" width="16" height="13" rx="0" fill="#14161A" opacity=".85"/>
      <rect x="44" y="39" width="16" height="13" rx="6.5" fill="#14161A" opacity=".85"/>
    </g>
    <circle class="ring" cx="74" cy="16" r="7" fill="#D7263D"/>
    <circle cx="74" cy="16" r="7" fill="#D7263D"/>
  </g>

  <text x="176" y="144" class="sans" font-size="58" font-weight="700" fill="#14161A" letter-spacing="-1.5">RecallRoom</text>
  <text x="178" y="184" class="sans" font-size="22" fill="#5F5E5A">A drug-recall desk for pharmacy chains, where</text>
  <text x="178" y="214" class="sans" font-size="22" fill="#5F5E5A">AI agents and people work in the same chat rooms.</text>

  <!-- The recall, as it plays out in #recall-hq -->
  <g transform="translate(700 28)">
    <rect width="452" height="244" rx="16" fill="#FFFFFF" stroke="#DAD3C4" stroke-width="2"/>
    <text x="22" y="34" class="sans" font-size="16" font-weight="700" fill="#14161A"># recall-hq</text>
    <circle cx="422" cy="29" r="5" fill="#1F9D55"/>
    <rect x="1" y="50" width="450" height="1" fill="#ECE6D9"/>

    <g class="m m1">
      <circle cx="34" cy="78" r="12" fill="#D7263D"/><text x="34" y="83" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
      <text x="56" y="74" class="sans" font-size="12" font-weight="700" fill="#14161A">sentinel</text>
      <text x="56" y="92" class="sans" font-size="13" fill="#3A3A38">Recall opened: 331 batches on CDSCO's Sep list</text>
    </g>
    <g class="m m2">
      <circle cx="34" cy="122" r="12" fill="#D97757"/><text x="34" y="127" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
      <text x="56" y="118" class="sans" font-size="12" font-weight="700" fill="#14161A">matcher <tspan font-weight="400" fill="#8A8780">· Claude Code</tspan></text>
      <text x="56" y="136" class="sans" font-size="13" fill="#3A3A38">2 stores, 6 batches, 162 units on the shelves</text>
    </g>
    <g class="m m3">
      <circle cx="34" cy="166" r="12" fill="#2E5BBA"/><text x="34" y="171" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q</text>
      <text x="56" y="162" class="sans" font-size="12" font-weight="700" fill="#14161A">QA Head</text>
      <rect x="56" y="168" width="196" height="20" rx="5" fill="#F1EEE6"/>
      <text x="63" y="182" class="mono" font-size="12" fill="#14161A">@sentinel approve R-…</text>
      <circle cx="268" cy="178" r="9" fill="#1F9D55"/>
      <path d="M263.5 178 l3 3 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="m m4">
      <circle cx="34" cy="210" r="12" fill="#D7263D"/><text x="34" y="215" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
      <text x="56" y="206" class="sans" font-size="12" font-weight="700" fill="#14161A">sentinel</text>
      <text x="56" y="224" class="sans" font-size="13" fill="#1F9D55" font-weight="600">Recall closed: every batch photo-checked</text>
    </g>
    <g class="typing" transform="translate(380 29)">
      <circle cx="0" cy="0" r="3" fill="#8A8780"/><circle cx="10" cy="0" r="3" fill="#8A8780"/><circle cx="20" cy="0" r="3" fill="#8A8780"/>
    </g>
  </g>
</svg>
