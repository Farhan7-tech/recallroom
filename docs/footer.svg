<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="t">
  <title id="t">Built on Switch for the Flip the Switch hackathon by WeMakeDevs and DevTools Academy. Open source under Apache-2.0.</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .wire { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
    .p { animation: hop 4.8s ease-in-out infinite; }
    .p2 { animation-delay: 1.6s; } .p3 { animation-delay: 3.2s; }
    .dot { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes hop { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(700px); opacity: 0; } }
    @keyframes beat { 0%, 30% { transform: scale(1); } 40% { transform: scale(1.5); } 50%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .wire, .p, .dot { animation: none; } .p { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="1198" height="218" rx="20" fill="#14161A" stroke="#33353A" stroke-width="2"/>

  <!-- Rooms passing messages -->
  <path d="M180 70 H1020" class="wire" fill="none" stroke="#4A4C52" stroke-width="2"/>
  <circle class="p" cx="250" cy="70" r="5" fill="#D7263D"/>
  <circle class="p p2" cx="250" cy="70" r="5" fill="#F0B429"/>
  <circle class="p p3" cx="250" cy="70" r="5" fill="#1F9D55"/>
  <g class="sans" font-size="13" text-anchor="middle">
    <rect x="110" y="54" width="140" height="32" rx="16" fill="#23252B" stroke="#4A4C52"/><text x="180" y="75" fill="#E9E5DC"># recall-hq</text>
    <rect x="530" y="54" width="140" height="32" rx="16" fill="#23252B" stroke="#4A4C52"/><text x="600" y="75" fill="#E9E5DC"># store-pune</text>
    <rect x="950" y="54" width="140" height="32" rx="16" fill="#23252B" stroke="#4A4C52"/><text x="1020" y="75" fill="#E9E5DC">Telegram store</text>
  </g>

  <!-- Small logo -->
  <g transform="translate(386 124)">
    <rect width="36" height="36" rx="9" fill="#F6F3EC"/>
    <path d="M9 10 h18 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-11 l-5 4 v-4 h-2 a3 3 0 0 1 -3 -3 v-9 a3 3 0 0 1 3 -3 z" fill="#14161A"/>
    <circle class="dot" cx="30" cy="7" r="3.5" fill="#D7263D"/>
  </g>
  <text x="438" y="150" class="sans" font-size="22" font-weight="600" fill="#F6F3EC">Built on Switch, for Flip the Switch</text>
  <text x="600" y="192" class="sans" font-size="16" fill="#A8A49C" text-anchor="middle">WeMakeDevs × DevTools Academy hackathon · Open source under Apache-2.0</text>
</svg>
