<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="t">
  <title id="t">Watch the 2:30 demo video on YouTube</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
    .ring2 { animation-delay: 1.1s; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: play 6s linear infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .5; } 80%, 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes play { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0; } .bar { animation: none; transform: scaleX(.35); } }
  </style>

  <rect x="1" y="1" width="1198" height="218" rx="20" fill="#14161A" stroke="#33353A" stroke-width="2"/>

  <!-- Play button -->
  <g transform="translate(150 104)">
    <circle class="ring" r="46" fill="#D7263D"/>
    <circle class="ring ring2" r="46" fill="#D7263D"/>
    <circle r="46" fill="#D7263D"/>
    <path d="M-14 -22 L24 0 L-14 22 Z" fill="#FFFFFF"/>
  </g>

  <text x="240" y="92" class="sans" font-size="40" font-weight="700" fill="#F6F3EC">Watch the demo</text>
  <text x="240" y="132" class="sans" font-size="20" fill="#A8A49C">2:30 · a test recall on CDSCO's real list, from scan to the last shelf photo</text>

  <!-- Progress bar -->
  <rect x="240" y="160" width="900" height="6" rx="3" fill="#33353A"/>
  <rect class="bar" x="240" y="160" width="900" height="6" rx="3" fill="#D7263D"/>
  <text x="1140" y="92" class="sans" font-size="16" fill="#A8A49C" text-anchor="end">YouTube ▸</text>
</svg>
