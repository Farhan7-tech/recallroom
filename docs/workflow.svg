<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">How a recall moves through RecallRoom</title>
  <desc id="d">The regulator's list goes to sentinel, then the matcher, then comms. Everything stops at the QA Head's approval, which is checked in code; an approval sent from a store's Telegram is refused. After approval, the store runner confirms each batch from shelf photos and the recall closes.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 9s ease-in-out infinite; }
    .tok { animation: travel 9s ease-in-out infinite; }
    .gate { transform-box: fill-box; transform-origin: center; animation: hold 9s ease-in-out infinite; }
    .bad { animation: bounce 9s ease-in-out infinite; }
    .x { opacity: 0; animation: refuse 9s ease-in-out infinite; }
    .done { opacity: 0; animation: done 9s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1; } 45% { stroke-dashoffset: .44; } 62% { stroke-dashoffset: .44; } 88%, 100% { stroke-dashoffset: 0; } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; } 45% { transform: translateX(560px); } 62% { transform: translateX(560px); } 85% { transform: translateX(1000px); opacity: 1; } 88%, 100% { transform: translateX(1000px); opacity: 0; } }
    @keyframes hold { 0%, 44% { transform: scale(1); } 50% { transform: scale(1.08); } 56% { transform: scale(1); } 100% { transform: scale(1); } }
    @keyframes bounce { 0%, 18% { transform: translate(0, 0); opacity: 0; } 22% { opacity: 1; } 32% { transform: translate(0, 36px); opacity: 1; } 40%, 100% { transform: translate(0, 8px); opacity: 0; } }
    @keyframes refuse { 0%, 30% { opacity: 0; } 33%, 44% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes done { 0%, 86% { opacity: 0; } 90%, 97% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .tok, .gate, .bad, .x, .done { animation: none; } .flow { stroke-dashoffset: 0; } .tok, .bad { opacity: 0; } .x, .done { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="1198" height="298" rx="20" fill="#F6F3EC" stroke="#DAD3C4" stroke-width="2"/>

  <!-- Track -->
  <path d="M100 120 H1100" fill="none" stroke="#E2DBCB" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 120 H1100" class="flow" pathLength="1" fill="none" stroke="#D7263D" stroke-width="4" stroke-linecap="round"/>

  <!-- Nodes -->
  <g class="sans" text-anchor="middle">
    <g transform="translate(100 120)">
      <circle r="30" fill="#FFFFFF" stroke="#14161A" stroke-width="2.5"/>
      <rect x="-11" y="-14" width="22" height="28" rx="3" fill="none" stroke="#14161A" stroke-width="2.2"/>
      <path d="M-6 -6 h12 M-6 0 h12 M-6 6 h8" stroke="#14161A" stroke-width="2" stroke-linecap="round"/>
      <text y="58" font-size="16" font-weight="700" fill="#14161A">CDSCO list</text>
      <text y="78" font-size="13" fill="#6B6862">failed batches</text>
    </g>
    <g transform="translate(300 120)">
      <circle r="30" fill="#D7263D"/>
      <text y="7" font-size="20" font-weight="700" fill="#FFFFFF">S</text>
      <text y="58" font-size="16" font-weight="700" fill="#14161A">sentinel</text>
      <text y="78" font-size="13" fill="#6B6862">Java, Switch protocol</text>
    </g>
    <g transform="translate(480 120)">
      <circle r="30" fill="#D97757"/>
      <text y="7" font-size="20" font-weight="700" fill="#FFFFFF">M</text>
      <text y="58" font-size="16" font-weight="700" fill="#14161A">matcher</text>
      <text y="78" font-size="13" fill="#6B6862">Claude Code</text>
    </g>
    <g transform="translate(660 120)">
      <g class="gate">
        <rect x="-34" y="-34" width="68" height="68" rx="16" fill="#14161A"/>
        <rect x="-11" y="-3" width="22" height="18" rx="3" fill="#FFFFFF"/>
        <path d="M-7 -3 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      </g>
      <text y="62" font-size="16" font-weight="700" fill="#14161A">QA Head approves</text>
      <text y="82" font-size="13" fill="#6B6862">checked in code, by account</text>
    </g>
    <g transform="translate(870 120)">
      <circle r="30" fill="#D97757"/>
      <text y="7" font-size="20" font-weight="700" fill="#FFFFFF">R</text>
      <text y="58" font-size="16" font-weight="700" fill="#14161A">store-runner</text>
      <text y="78" font-size="13" fill="#6B6862">reads strip photos</text>
    </g>
    <g transform="translate(1100 120)">
      <circle r="30" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2.5"/>
      <path d="M-11 0 l7 7 l15 -15" fill="none" stroke="#1F9D55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="58" font-size="16" font-weight="700" fill="#14161A">Recall closed</text>
      <text y="78" font-size="13" fill="#6B6862">every batch confirmed</text>
    </g>
  </g>

  <!-- comms drafts alongside the matcher -->
  <g class="sans" transform="translate(480 48)" text-anchor="middle">
    <rect x="-62" y="-20" width="124" height="34" rx="17" fill="#FFFFFF" stroke="#DAD3C4" stroke-width="1.5"/>
    <text y="2" font-size="13" fill="#3A3A38"><tspan font-weight="700">comms</tspan> · Codex drafts</text>
  </g>

  <!-- Stores -->
  <g class="sans" font-size="13" fill="#3A3A38">
    <rect x="800" y="232" width="140" height="28" rx="14" fill="#FFFFFF" stroke="#DAD3C4" stroke-width="1.5"/>
    <text x="870" y="251" text-anchor="middle">Telegram + Mattermost</text>
  </g>

  <!-- An approval from the wrong account bounces off the gate -->
  <text x="660" y="26" class="sans" font-size="12" fill="#8A8780" text-anchor="middle">approve sent from a store phone</text>
  <g class="bad">
    <circle cx="660" cy="42" r="9" fill="#D7263D"/>
  </g>
  <g class="x sans">
    <rect x="696" y="48" width="140" height="26" rx="13" fill="#FDECEE" stroke="#D7263D" stroke-width="1.5"/>
    <text x="766" y="66" font-size="13" font-weight="700" fill="#B01F33" text-anchor="middle">Not accepted</text>
  </g>

  <!-- The recall token -->
  <g class="tok">
    <circle cx="100" cy="120" r="10" fill="#D7263D" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <g class="done sans">
    <rect x="1020" y="26" width="160" height="30" rx="15" fill="#E7F5EC" stroke="#1F9D55" stroke-width="1.5"/>
    <text x="1100" y="46" font-size="13" font-weight="700" fill="#17733F" text-anchor="middle">162 units off shelves</text>
  </g>
</svg>
